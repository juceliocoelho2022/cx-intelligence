name: One-time publish official CX Intelligence v1.5.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v15-release.yml
permissions:
  contents: write
jobs:
  publish-official-v1-5:
    if: github.repository == 'juceliocoelho2022/cx-intelligence'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact tested release source
        run: |
          git cat-file -e 62c37174df8bebba39dbbaa31b454cf5cb2c9b78^{commit}
          test -s docs/RELEASE_NOTES_V1.5.0.md
          grep -Fq '"schema_version": "1.5.0"' src/cx_goals.py
          grep -Fq '"1.5.0-beta"' src/cx_goals.py
          grep -Fq 'Customer Experience Analytics · v1.5.0' app.py
      - name: Require green CI on exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=pending
          for i in $(seq 1 48); do
            result="$(gh api repos/juceliocoelho2022/cx-intelligence/actions/runs/40126717105 --jq '.conclusion // "pending"')"
            if [ "$result" = "success" ]; then break; fi
            if [ "$result" != "pending" ]; then
              echo "CI failed: $result"
              exit 1
            fi
            sleep 15
          done
          test "$result" = "success" || { echo 'CI is not green'; exit 1; }
      - name: Create immutable official tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.5.0 >/dev/null 2>&1; then
            echo 'v1.5.0 already published. Verifying existing release.'
          else
            gh release create v1.5.0 --target 62c37174df8bebba39dbbaa31b454cf5cb2c9b78 \
              --title 'CX Intelligence v1.5.0 — Metas de CX e Planos de Ação' \
              --notes-file docs/RELEASE_NOTES_V1.5.0.md
          fi
      - name: Validate tag target and release visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.5.0 --json tagName,isDraft,isPrerelease --jq '.tagName + " " + (.isDraft|tostring) + " " + (.isPrerelease|tostring)' | grep -Fx 'v1.5.0 false false'
          actual_sha="$(gh api repos/juceliocoelho2022/cx-intelligence/git/ref/tags/v1.5.0 --jq '.object.sha')"
          test "$actual_sha" = "62c37174df8bebba39dbbaa31b454cf5cb2c9b78"
          gh release view v1.5.0 --json body --jq '.body' | grep -Fq 'Metas configuráveis'
          echo 'Verified: v1.5.0 release published from tested SHA.'
