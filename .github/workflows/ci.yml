name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://cx_test:cx_test_only@127.0.0.1:5434/cx_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cx_test
          POSTGRES_PASSWORD: cx_test_only
          POSTGRES_DB: cx_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U cx_test -d cx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q app.py src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Run release smoke tests
        run: python -m pytest tests/test_release_smoke.py -q
      - name: Run synthetic ETL
        run: python -m src.pipeline
      - name: Evaluate synthetic baseline
        run: python -m src.model

  mobile-browser:
    name: Mobile browser smoke (390px)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CX_DATA_SOURCE: csv
      CX_PUBLIC_DEMO: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and Playwright
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "playwright>=1.56,<2"
      - name: Start Streamlit server
        run: |
          python -m streamlit run app.py --server.address 127.0.0.1 --server.port 8501 --server.headless true > streamlit-mobile.log 2>&1 &
          for n in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          cat streamlit-mobile.log
          exit 1
      - name: Verify mobile viewport and analytics
        run: python tests/browser/mobile_v13_smoke.py
      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cx-v13-mobile-screenshot
          path: |
            artifacts/
            streamlit-mobile.log
          if-no-files-found: warn
