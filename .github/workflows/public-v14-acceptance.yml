name: One-time public v1.4 report export acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-v14-acceptance.yml
      - tests/browser/public_v14_download.py
permissions:
  contents: read
jobs:
  public-report-downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Chrome automation
        run: python -m pip install 'playwright>=1.56,<2'
      - name: Allow current Render auto-deploy to finish
        run: sleep 180
      - name: Confirm public health before interacting
        run: curl --fail --retry 8 --retry-delay 7 --retry-all-errors --max-time 30 https://cx-intelligence-demo.onrender.com/_stcore/health
      - name: Download and inspect both real public reports
        run: python tests/browser/public_v14_download.py
      - name: Upload diagnostic screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-v14-export-diagnostics
          path: artifacts/public_bi_v14_failure_*.png
          if-no-files-found: ignore
